name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test (firmware/lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/lib
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings
      - name: cargo build
        run: cargo build --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: descriptor freshness
        run: cargo run -p table-export -- ../../descriptors && git diff --exit-code ../../descriptors && test -z "$(git status --porcelain ../../descriptors)"
      - name: descriptor version gate
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          bash .github/check-descriptor-version.sh
      - name: cargo check --features mocks
        run: cargo check -p osc-servo-drivers --features mocks
      - name: cargo check --features bench
        run: cargo check -p osc-servo-drivers --features bench
      - name: cargo test osc-host --features bench
        run: cargo test -p osc-host --features bench
      - name: cargo check osc-integration --features bench
        run: cargo check -p osc-integration --features bench

  ch32-build-test:
    name: build + test (firmware/servo-ch32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/servo-ch32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/servo-ch32
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --tests --features ch32v006x8x6 -- -D warnings
      - name: cargo build
        run: cargo build --features ch32v006x8x6
      - name: cargo test
        run: cargo test --features ch32v006x8x6 --lib
      - name: cargo check --features bench
        run: cargo check --features ch32v006x8x6,bench

  osc-dev-v006-cross-build:
    name: cross-build (boards/osc-dev-v006)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/boards/osc-dev-v006
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + rust-src + llvm-tools)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools, clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/boards/osc-dev-v006
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo check --workspace
        run: cargo check --workspace
      - name: cargo build --release (app image)
        run: cargo build --release -p osc-dev-v006-app
      - name: no soft div/mod/mul gate
        working-directory: ${{ github.workspace }}
        run: bash .github/check-soft-arith.sh

  host-ch32-build-test:
    name: build + test (firmware/host-ch32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/host-ch32
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/host-ch32
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --tests -- -D warnings
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test --lib
      - name: cargo check --no-default-features (basic profile)
        run: cargo check --no-default-features

  osc-adapter-wchlinke-cross-build:
    name: cross-build (boards/osc-adapter-wchlinke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/boards/osc-adapter-wchlinke
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + target + llvm-tools)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools, clippy, rustfmt
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/boards/osc-adapter-wchlinke
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo build --release (adapter image)
        run: cargo build --release
      - name: iap header gate (loader magic at 0x50/0x54)
        working-directory: ${{ github.workspace }}
        run: bash .github/check-iap-header.sh

  bench-tools:
    name: build + test (tools/bench)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bench
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/bench
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --tests -- -D warnings
      - name: cargo test (units; hardware suite is on-rig only)
        run: cargo test --lib

  client:
    name: build + test (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt + wasm)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (fake-adapter)
        run: cargo clippy --tests --no-default-features --features fake-adapter -- -D warnings
      - name: cargo clippy (nusb)
        run: cargo clippy --tests -- -D warnings
      - name: cargo test (full stack over the fake adapter)
        run: cargo test --no-default-features --features fake-adapter
      - name: cargo clippy (fake-adapter + bench)
        run: cargo clippy --tests --no-default-features --features fake-adapter,bench -- -D warnings
      - name: cargo test (full stack, wire instrument)
        run: cargo test --no-default-features --features fake-adapter,bench
      - name: cargo build (nusb backend)
        run: cargo build
      - name: cargo check (wasm32, no default features)
        run: cargo check --target wasm32-unknown-unknown --no-default-features
      - name: cargo clippy (wasm32, no default features)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: cargo check (wasm32, webusb backend)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features webusb
      - name: cargo clippy (wasm32, webusb backend)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features webusb -- -D warnings
      - name: cargo clippy (osc-client-web, wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -p osc-client-web -- -D warnings
      - name: cargo test (osc-client-web helpers, native)
        run: cargo test -p osc-client-web
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: wasm-pack build (osc-client-web, generated .d.ts must build)
        working-directory: client/web
        run: wasm-pack build --target web --out-dir pkg

  osc-cli:
    name: build (tools/osc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/osc
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/osc
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --tests -- -D warnings
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test

  osc-ident:
    name: build + test (ident)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ident
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly + clippy + rustfmt + wasm)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ident
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --tests -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo check (wasm32, the lib must stay sans-io)
        run: cargo check --target wasm32-unknown-unknown
