[package]
name    = "osc-integration"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
osc-servo-core     = { workspace = true, features = ["log"] }
osc-servo-drivers  = { workspace = true, features = ["log"] }
osc-host     = { workspace = true }
osc-protocol = { workspace = true, features = ["software-crc"] }
control-table.workspace = true
tinyboot-protocol = "0.5.1"
log = "0.4"

[features]
bench = ["osc-host/bench"]
# The loop-margin stimulus (kernel sec 2.7), for the tests that read the
# loops' margins.
loop-margin = ["osc-servo-core/loop-margin"]

[dev-dependencies]
env_logger   = "0.11"
rstest       = "0.23"
rstest_reuse = "0.7"
test-log     = "0.2"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[test]]
name = "chains"
path = "tests/chains.rs"

[[test]]
name = "resilience"
path = "tests/resilience.rs"

[[test]]
name = "timing"
path = "tests/timing.rs"

[[test]]
name = "host_loop"
path = "tests/host_loop.rs"

[[test]]
name = "burst"
path = "tests/burst.rs"

[[test]]
name = "loop_margin"
path = "tests/loop_margin.rs"
required-features = ["loop-margin"]
