[workspace]
resolver = "2"

[package]
name    = "osc-servo-ch32"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ch32-metapac     = { version = "0.1.2", default-features = false, features = ["pac"] }
osc-servo-core         = { path = "../lib/core" }
osc-servo-drivers      = { path = "../lib/drivers" }
osc-protocol     = { path = "../lib/osc-protocol" }
osc-log          = { path = "../lib/log" }
portable-atomic  = { version = "1", default-features = false }
riscv            = "0.12"
critical-section = "1.2"
defmt            = { version = "1", optional = true }

# RISC-V targets lack hardware CAS; opt into the single-core assumption so
# RMW lowers to lw/sw pairs instead of pulling in critical-section. Host
# builds (clippy, unit tests) use portable-atomic's native x86 path.
[target.'cfg(target_arch = "riscv32")'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["unsafe-assume-single-core"] }
# Boot confirmation against the board's tinyboot META page.
tinyboot-ch32   = { version = "0.7.2", default-features = false }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[build-dependencies]
ch32-metapac = { version = "0.1.2", default-features = false, features = ["metadata"] }

[features]
default      = ["ch32v006x8x6"]
ch32v006x8x6 = ["ch32-metapac/ch32v006x8x6", "tinyboot-ch32/ch32v006x8x6"]
rt           = ["ch32-metapac/rt"]
# Forward the drivers' probe counters (crate::bench pattern).
bench        = ["osc-servo-drivers/bench"]
# The TEL step measurement image: TEL tallies in place of the bus record.
bench-telcost = ["bench", "osc-servo-drivers/bench-telcost"]
# The uncommon tick instruments beside the bench record: gamma(k), long
# ticks, entry lateness.
bench-window = ["bench"]
defmt        = ["dep:defmt", "osc-servo-core/defmt", "osc-servo-drivers/defmt", "osc-log/defmt"]
