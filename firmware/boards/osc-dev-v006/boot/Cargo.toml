[package]
name    = "osc-dev-v006-boot"
version = "0.1.0"
edition.workspace = true

[[bin]]
name  = "osc-dev-v006-boot"
test  = false
bench = false

[dependencies]
tinyboot-ch32    = { version = "0.6.0", default-features = false, features = ["ch32v006x8x6", "system-flash", "half-duplex"] }
tinyboot-ch32-rt = "0.4.1"
panic-halt       = "1"
