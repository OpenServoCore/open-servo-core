[board]
# Also the tinyboot compatibility key: the app and the bootloader both take it from here.
compat = "osc-dev-v006"
hw_rev = 2

[wiring]
stat_led_active = "Low"

# DRV8212P nSLEEP; the Rh1 pull-down holds it asleep through reset.
[wiring.drv_en]
pin = "PC3"
active = "High"

# Bare OPA (PD7 needs RST_MODE=11 and JP1 closed) behind the
# external Rf 6K4 / Rg 430 difference network: G = 14.884.
[wiring.current_sense]
gain_milli = 14_884

[wiring.current_sense.opa]
pos = "PD7"
neg = "PD0"
out = "PD4"

# A0 is the NTC with JP2 on NTC-IN.
[wiring.sensors]
pos = "A1"
vmotor = ["A5", "A6"]
vbus = "A2"
ntc = "A0"

[calibration]
shunt_r_mohm = 60
# SS54 OR-ing Schottkys (Dp1, Dp2) between the supply inputs and VSYS.
rail_drop_mv = 250
vdd_mv = 3300
# Scan order is [high tap, low tap, shunt, pos, vbus, ntc], the taps
# following the drive direction. The i floor sits inside the settle gain's
# reach (`i_settle_gain`), where the amplifier's own deficit is a calibrated
# gain, not an error. On a motor the edge also charges the winding's
# terminal capacitance (~10 nF on the MG90) through the shunt, which reads
# HIGH by a fixed few counts under ~72 ticks, 10-15% of a 30-count current
# at the floor; no gain removes an additive term. The v floor is the crest
# taps' window: the low-side tap closes 21 ticks before the crest
# (injected), so it needs the ON edge's 42-tick lag plus its settle, and the
# high-side tap at +87 must still be inside the window when the OFF edge
# lands 14 ticks late. A 4.2 ohm grid ladder, read with those taps at -37
# and +83, gives R within 1.1% from 84 ticks forward, and within 0.9% from
# 96 in both directions.
i_window_min_ticks = 64
v_window_min_ticks = 93
# The back-EMF observer reads wherever both terminal taps read: the taps'
# own floor.
bemf_window_min_ticks = 93
# A narrower command loses its whole pulse, and the first shunt window read
# after one reads far over the winding current.
bridge_min_ticks = 27
# The amplifier tail after a drive pulse, measured on board D over a duty
# grid: the trough sits a flat 5 counts over the disabled-driver rest bias
# down to 960 brake ticks (20% duty), then climbs with drive current - 7
# counts at 30%, 16 at 60%, 38 at 85%.
bias_brake_min_ticks = 960
# Bottom legs return to VB: a tap reads 0.2 x terminal + 0.8 x VB.
vmotor_divider = { top_ohm = 6_400, bot_ohm = 1_600 }
# Returned to GND.
vbus_divider = { top_ohm = 6_400, bot_ohm = 1_600 }
# VB: 3V3 -430- VB -100- GND.
vmotor_bias = { top_ohm = 430, bot_ohm = 100 }
ntc = { pullup_ohm = 10_000, r25_ohm = 10_000, beta = 3950 }

# The amplifier's step response at the crest sample, op-amp in normal mode,
# board #1: the shunt approaches its plateau from below, about 4.5% low at
# 60 ticks and 1.1% at 120, settled from ~208, the same in both drive signs.
# Each band holds the inverse at its center: a high-speed-mode table that
# put every 3.7 ohm grid ladder rung from 60 ticks within 0.16%, times the
# high-speed / normal ratio of paired grid bursts (shunt over the terminal
# difference, which cancels the rail's sag). The modes agree within 0.1%
# from 96 ticks, and the bands under the 64-tick floor never apply.
[calibration.i_settle_gain]
start_ticks = 40
q15 = [
    37138, 35303, 34342, 33918, 33643, 33470, 33374, 33259, 33213, 33156, 33103,
    33052, 33020, 32982, 32938, 32900, 32868, 32841, 32824, 32806, 32785,
]

[defaults]
pos_min_phys_counts = 0
pos_max_phys_counts = 4095
id = 1
baud = "B1000000"

# Boot limits until the host supplies nameplate and thermal values.
[protection]
# The maxon A-max 12 data sheet gives 59.5 K/W winding to ambient and a
# 5.03 s winding constant (source linked in control-theory). At a 60 K
# rise, an assumed 5 ohm winding would hold about 0.45 A in free air. The
# 250 mA default leaves unmeasured enclosure margin; the host must replace
# it with the actual motor's rating.
i_cont_ma = 250
# Below the fold so a held press does not unfold.
stall_release_ma = 90
# Copper and shunt guard, not a gear-train limit: 2.2 A sits above any
# micro-class stall on 2S (2.1 A) and below where this chain saturates
# (~2.3 A over its 1.10 V reference on 60 mOhm, the amplifier topping out
# at VDD - 0.16 V), so the trip stays measurable.
oc_trip_ma = 2200
oc_trip_us = 400
# The octave below the reference motor's winding constant, so the estimate
# rises sooner.
thermal_tau_s = 4
# 90 C.
cutoff_cc = 9000
# True brown-out floor, not a battery-health line: the default must sit
# below every legal supply, and a USB-fed 5 V bench bus idles at ~4.3 V.
# Pack-health thresholds are per-product tuning, written by the host.
v_undervolt_mv = 2900
# About what a USB lead and its connectors add, so a 500 mA cap folds over
# the 400 mV above the floor; a pack's floor and source are per-product
# tuning, written by the host.
rail_source_mohm = 800
drive_polarity = true
