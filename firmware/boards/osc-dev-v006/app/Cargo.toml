[package]
name    = "osc-dev-v006-app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name  = "osc-dev-v006-app"
path  = "src/main.rs"
test  = false
bench = false

[dependencies]
osc-servo-ch32      = { path = "../../../servo-ch32", default-features = false, features = ["ch32v006x8x6", "rt"] }
tinyboot-ch32 = { version = "0.7.1", default-features = false, features = ["ch32v006x8x6", "system-flash"] }
qingke        = { version = "0.8.2", features = ["v2c", "critical-section-impl"] }
qingke-rt     = { version = "0.8.2", features = ["v2c"] }
panic-halt    = "1"
defmt         = { version = "1", optional = true }
defmt-rtt     = { version = "1", optional = true }

[features]
default = []
defmt   = ["dep:defmt", "dep:defmt-rtt", "osc-servo-ch32/defmt"]
# Debug-link-dumpable probe counters (no wire/table impact).
bench   = ["osc-servo-ch32/bench"]
# TEL cost per step, no bus record (scripts/build-image.sh --telcost).
bench-telcost = ["bench", "osc-servo-ch32/bench-telcost"]
# gamma(k), long ticks and entry lateness (scripts/build-image.sh --window).
bench-window = ["bench", "osc-servo-ch32/bench-window"]
