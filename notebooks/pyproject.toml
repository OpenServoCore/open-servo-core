[project]
name = "oscnb"
version = "0.1.0"
description = "Notebooks for exploring OpenServoCore rig captures"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipympl>=0.9",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "opencv-contrib-python-headless>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
