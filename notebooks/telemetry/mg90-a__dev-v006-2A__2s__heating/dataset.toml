servo = "mg90-a"
supply = "2s"
rule = "limit"
current_limit_counts = 280
captured = "2026-10-05"
notes = """The MG90's heating curve in free air: two heater blocks with their cool-downs and a locked-rotor hold, on rev 2A board #1 (main 56555e53, the identified set stamp 0xa4f4) fed by the 2S pack (rail 7.88 V at the start of the night, 7.43 V at the end). The servo sits on its bench mount in room air with the board right side up beside it. A K thermocouple bead on the motor can, read by a B41T+ meter over Bluetooth, is the can temperature truth: the `can_c` column of every temp.csv, bursts.csv and hold.csv. The `ntc_raw` columns are the board's NTC channel, which read nothing useful (1815 to 1875 counts all night); ignore them. The room is AC-cycled, 26.5 to 27.3 C on a rested can through the night.

blocks.csv names each capture folder, its bringup source, the heater that ran in it, the current limit the heater ran under, the temp.csv phases of its heating and cooling, and which R_ref the thermometer in its bursts.csv used. Every capture holds the driver script's files: temp.csv (the thermocouple, the NTC channel, the rail and the heater's 5 s current statistics, one row every 5 s while the heater ran or the script rested; no rows while an `osc ident burst` run was in progress), heater.csv.gz (every heater poll at about 110 Hz: position, the commanded and applied duty or the goal offset, the firmware's current estimate i_hat in counts and the fault code), bursts.csv (one row per `osc ident burst` run: the waveform-fit R, its sd, L, V0, the line's slope and V/I at the limit, the verdict, and the thermometer's T(R) against the block's R_ref; its `dir` column is cut to the run's folder under ident/), heat.log and run.out (the console), and ident/<unix>/ with the run's 24 burst captures (16 from rest, 8 from a hold) gzipped and the run's console report as report.log.gz. The bias_tel, bias_snapshots and inductance_snapshots files of each run are left out; nothing else differs from what the scripts wrote.

rest/capture-1 is the R_ref run (bringup d6b): five rest bursts at mid travel 65 s apart on a servo that had rested, 4.675 to 4.836 ohm, median 4.725 ohm at a mean can of 26.23 C. Its 0.3 W dither block then stopped 26 s in: one 75 ms host stall made a reversal late at 36% amplitude and the shaft ran 450 counts past the turn point into the position guard (2045 +/- 700). No current trip, no fault. Its heater.csv.gz holds those 26 s.

dither/capture-1 is the 0.25 W block (d6c, heat3.py): an open-loop square-wave dither at mid travel, the sign steered by position (reverse when the shaft passes 2045 +/- 100, led by 80 ms), amplitude from 20% stepping to a 30% cap, with the 280-count current limit left in place. The limiter governed: the applied duty averaged 19.5% against the 30% command, so the current, 0.228 A rms, was set by the limit and not by the amplitude. The script's power column is i_rms^2 x R_ref, 0.246 W while the heater ran; the heater ran 85% of the block's wall time, the rest being the burst runs (every 120 s of heating, an `osc ident burst` run of about 20 s and a re-centre). R_ref was reused from rest/capture-1 rather than taken fresh (the script's --rref/--tref), 13 minutes after that run ended, after a 5 min wait for the can to come back under 26.5 C. The block ran 28.7 min and ended when the shaft left to pos 3351 (guard 2045 +/- 1000); the can had been flat within 0.3 C for the last 12 min. No cool-down was logged by this script.

dither/capture-2 is that block's cool-down (d6c/cool, cool.py), started 162 s after the heater stopped: 30 min of bursts every 30 s with torque off between them, the thermocouple every 5 s. By its first reading the can had already come down from 33.6 to 29.1 C.

steps/capture-1 is the 0.42 W block (d6d, heat4.py): a closed-loop heater, the servo in Position mode with its goal toggled between 2045 - 300 and 2045 + 300, the period adapting between 80 and 1000 ms toward a mean |i| of 0.9 x the limit; it sat at the 80 ms floor throughout. The current limit was raised to 520 counts in RAM for the heater, but the current, 0.299 A rms, was set by the trajectory's acceleration limit (accel_limit_q88, a stamp-covered field: raising it in RAM latches STAMP_MISMATCH and the closed loop refuses), not by the limit; the applied duty averaged 18 to 22%. The power rose through the block, 0.38 W in the first 5 min to 0.44 W in the last, as the current crept up with the warming servo. The script took its own R_ref first, three rest bursts, 4.722 / 4.690 / 4.582 ohm, median 4.690 at 27.0 C. The block ran its 47 min on the clock (the flat test never passed against the AC cycling) and the cool-down ran 20 min with a burst every 30 s. The three steps/trial-N folders are the one-minute heater trials that chose the amplitude and showed the current cap (trials 1 and 2 at the 280 limit drew 0.19 A rms, 0.17 W; trial 3 at 520 drew 0.287 A rms, 0.39 W, far under the 0.47 A that limit allows).

hold/capture-1 is the locked-rotor hold (d7, d7b.py): one free burst at mid travel, then the shaft seated against the low stop at 12% under the stall permit and held at -20% duty (the 280-count limiter governing, 0.24 A, 190 ticks of ON window) for 10 min, then released, re-centred, and 15 min of bursts every 60 s with torque off between them, then a gear-slip check (seat at 12%, hold at 7%: pos 267.9 against cal's 268, no slip). hold.csv.gz is every poll at about 5 Hz: the thermocouple, position, i_hat, the applied duty, the firmware thermometer's r_hat_q12 and t_winding_cc (both 0: the CALIB anchor r0_q12 / mu_q016 is unseeded on this servo), and the identification aggregates i_mean, vdiff_mean, duty_mean with their sequence counter, from which the script computed r_agg_ohm = (duty_mean x vdiff_mean / 32767) / |i_mean| in volts per count over amps per count. That aggregate route takes the commanded window for the drive pulse, so its level is not the burst's (the pulse's 27-tick shortfall is not in it); only its ratio over the hold is read. The hold's bursts.csv has no unix column; the run folders under ident/ are named by their start time, in the order of bursts.csv.

Post-heat R excess: after the 0.42 W block every free-shaft burst reads 4 to 16% over copper's prediction from the can and the block's own R_ref, and the excess climbs through the 20 min cool-down while the can sits flat at 27.2 C; it is still in the hold's bursts before and after. The bench RCA (same night, 2000+ captures) found it in the circuit, not the winding: the per-rung V/I, the period average and the waveform fit move together, flat with current, held for over an hour with the can at room, created by the hard reversals at 0.47 A and knocked down but not removed by the 10 min locked hold. The 0.25 W block's cool-down bursts read about 2% over R_ref 30 min after its heater stopped and the fresh R_ref before the 0.42 W block read 1% under it an hour later, so that block left little or nothing. The 0.42 W block's bursts are not a winding thermometer; notebook 18 excludes them from every thermal fit.

Source: osc-dev-v006-bringup captures/servo-pass d6b, d6c, d6c/cool, d6d (with bench-tests/), d7 (bringup 6a31379); driver scripts scratchpad sp/heat2.py, heat3.py, heat4.py, cool.py, d7b.py, with d6d/heat4.py and d6b/heat2.py, d6c/heat3.py, d6c/cool/cool.py, d7/d7b.py kept beside the source data. The burst captures carry no sense block, so the board is not read from the data: these are rev 2A board #1 captures by the bench log, and nothing here identifies the unit."""
