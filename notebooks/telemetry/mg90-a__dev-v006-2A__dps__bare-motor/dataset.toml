servo = "mg90-a"
supply = "dps"
rule = "limit"
current_limit_counts = 280
captured = "2026-10-07"
notes = """The bench MG90's motor out of the servo: no gearbox, no pot, no load, taped to a ceramic plate and plugged into J4 of rev 2A board #1 on the main image (fw 65, plant stamp 0xf12a, current limit 280 counts in every capture, never raised, nothing saved). A FNIRSI DPS-150 fed the board on its battery wires, the battery out. An OWON B41T+ meter in ohms sat on the motor terminals the whole time, logged over Bluetooth; a reading taken while the bridge drives the same terminals is meaningless, so only standstill readings mean anything. The motor is the one notebooks 17 and 18 measured inside the servo.

char/ is the per-tick characterization, one `osc sweep --static-load` chain per cycle, capture-K holding cycle K (sweep.csv.gz per-tick TEL at 20 kHz, meta.json with the sense block that identifies the board, sweep.log the sweep's console). runlog.jsonl is the runner's log, one `cycle` row per cycle with its rail, duty, direction, schedule, t_off (unix s at torque off) and rc. Every drive is 300 ms, then a 60 s settle with torque off while the meter reads the rest resistance. The schedule at 5.0 V is a 6% stalled pre-pulse, `then:` the spin duty, then a coast (both bridge legs off, the terminals floating on the back-EMF): two coast:700 segments in cycle 1, one coast:500 from cycle 2 on. At 7.4 V there is no stalled pre-pulse. The applied duty (TEL duty_q15) is slew limited at 128 q15 per tick, so a rise is a ramp (6% to 20% in 36 ticks); the drop to coast is a single step.

The cycles ran in three parts. Part 1, cycles 1-22 at 5.0 V, meter log dmm.csv. Cycles 8 and 22 (5% reverse) failed on TEL sequence holes and garble in the coast segment on all three tries and left no capture; the runner stopped after the second. Part 2 is cycle 23 alone, meter log dmm2.csv: its nudge gate failed (spin current 0.78 counts over the trough against at least 30) with the taps showing the drive level, an open between the bridge and the motor at J4 that was fixed before part 2b. Cycle 23's capture is kept and is excluded from every analysis. Part 2b, cycles 24-100, meter log dmm3.csv, runlog rows tagged part 2b: cycles 24-50 at 5.0 V, 51-100 at 7.4 V; the 5% rungs at both rails have no coast segment. Cycle 28 (5.0 V 8% reverse) failed on a TEL burst timeout and cycle 69 (7.4 V 40% forward) on holes in both a coast and a drive segment; neither left a capture. In four late 7.4 V cycles the applied duty fell under the command (92 30% reverse, 93 30% forward, 98 40% reverse, 99 40% forward held at 5.8% for the whole 300 ms); the spin currents stayed under the 280-count limit. bench-note.txt is the bench driver's log with the pre-registered criteria of every part, kept as written.

e8/capture-1 is one `osc ident burst --static-load --burst-duties 20 --burst-captures 1` run at 5.0 V taken before cycle 1: the two 960-sample shunt bursts (20% forward and reverse from rest), the run's inductance snapshots and report.log, the console report with the waveform fit. The run declined itself (two captures cannot pass capture-agreement or split-halves). The burst captures carry no sense block.

two-current/ is a stalled two-duty test at 5.0 V: per seat, five pairs of 300 ms pulses at 6% then 8% with torque off between them, then a 12% spin pulse that moves the rotor to a new seat, then a 30 s settle on the meter. `th drive` polled at 20 ms (pulses/<tag>.csv.gz, one file per pulse, tag s<seat>p<pair>d<duty>), so there is no per-tick data and no way to tell from the data whether a stalled pulse moved the rotor. pulses.csv and seats.csv are the runner's summaries at its own 1118 counts per amp; the notebook recomputes from them through the board's constants. The runner's `moved` flags are not reliable (a tail row can carry the drive level); Aaron watched the seat 1-2 pulses and saw the 8% pulses not move. The run was stopped early by the harness: seats 1 and 2 complete, seat 3 nine pulses without its spin. dmm.csv is its meter log, runlog.jsonl its runner log.

breakaway/ is a duty ladder on a 3.76 V rail, each rung 2 s of OpenLoop duty polled by `th drive` at 25 ms: d1pct-4v at 1%, ladder-4v-N at N% for N = 5..40, and manual-4v-5, which despite its name ran at 14% (duty 4587 q15). Aaron watched it: no motion from 1 to 13%, first motion at 14%. The rotor was not moved between rungs, so every locked rung sits on the seat the last one left.

tape-test/tape.csv is the first running of the motor out of the servo, 9 s at 40% with the board's rail reading about 7.1 V, polled at 25 ms. The bench rule for bare-motor runs is Aaron's safety rule, at most 30 s on, then 20 s off; every capture here keeps it by a wide margin.

hand-map/ is the rest resistance across rotor stops before any running: Aaron turned the shaft by hand between stops with the meter on the terminals in ohms. dmm.csv and dmm2.csv are the meter logs; stops.csv is the 15 readings he took off the display 30 s after each stop. A bare 5.1 ohm resistor on the same clips read 5.11 before and after, so the meter did not drift.

ref/ holds two files that are not captures of this rig. in-servo-ident-report.txt is the console report of the in-servo identification of the same motor (the run that set the servo's stored R), kept for its waveform L, 0.757 mH. ramp-fits-analysis-note.csv is the per-cycle output of the bare-motor analysis note's ramp fit (tools/bench-scratch/analysis/ramp.py) on this data, run against the oscnb of that time; notebook 20 sets its own run beside it.

Source: osc-dev-v006-bringup captures/servo-pass/motor-bare/{char, two-current, breakaway-manual, tape-test} and captures/servo-pass/thermo-dmm/hand-turn, captures/servo-pass/reident/1791307157/report.txt and tools/bench-scratch/analysis/ramp_fits.csv. The per-tick sweep csvs, the bursts and the two-current pulse polls are gzipped; the char/cycles/cNNN/sweep/ folders became char/capture-K; the four failed cycles' header-only sweep csvs, the runner scripts, the bench driver's own analysis outputs and the two-current pulses-alt.csv / seats-alt.csv (an alternative motion rule) are left out; nothing else differs from what the scripts wrote."""

[char]
exclude_cycles = [23]
exclude_why = "J4 open: spin current 0.78 counts over the trough, no back-EMF in the coast"
