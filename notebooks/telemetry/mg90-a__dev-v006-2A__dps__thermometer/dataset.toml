servo = "mg90-a"
supply = "dps"
rule = "limit"
current_limit_counts = 280
captured = "2026-10-07"
notes = """The shipped winding thermometer (core estimator::thermal) on the bench: the firmware's own t_winding_cc, t_ntc_cc, r_hat_q12 and therm_flags logged beside a K thermocouple bead taped to the motor can, read over Bluetooth (the `func`/`value` packets of every meter.csv.gz, C, about two a second). Rev 2A board #1 and the bench MG90 on J4, fed by a DPS-150 at 7.4 V on the battery wires with the battery out, 3 Mbaud, the 280-count current limit throughout. The board sits on the bench beside the servo in room air. Notebook 19 reads it through oscnb.thermometer.

captures.csv names every capture folder, the bringup files it came from, the firmware image it ran (commit), what it is, and for the thermal holds `unix0`, the `osc ident thermal` run directory's name (the run's start, the clock the run's t_s / host_ms / t_ms count from). Five images: 127d2bca (run 3, the thermometer before the voltage band, the rise check and the excess bound; it carried the retired hot-boot rule), a87d94ac (run 4, the guards in; byte-identical to the merged main 26f38948), 26f38948 itself (firstseat/capture-1), bb9b0ceb (the hot-boot band widened to 6%: thermal/capture-1, firstseat/capture-2), b4c4775b (the bounded boot prior that replaced the hot-boot rule, the image notebook 19 grades: thermal/capture-2, boot/capture-1 and -2).

oab/capture-N is one out-and-back rep (bringup pr311 run 3 = capture-1, run 4 = capture-2): `osc reboot`, rest.csv.gz (660 s torque-off `th log` at 2 s, the rest offset is read over its last 180 s), oab.csv.gz (`th oab 490 150 240,30,240,30,240 60 400 2045`: a 150 s hold at the low stop, then out toward mid travel and back with torque off 240, 30, 240, 30, 240 s before each of five 60 s holds at the same stop, polled every few ms; `phase` names seekN, holdN, awayN), post.csv.gz (300 s torque-off log after), meter.csv.gz (the bead over the whole run), anchor.out (the `osc ident anchor --rested --save` console before the rep: the CALIB fields it wrote, r0_q12 4021 / 4078), rep.out (the rep's console), score.out (the bench scorer's output, score_r3.py / score_r4.py; run 3's scorer took each hold's LAST base, run 4's the FIRST: tests/test_thermometer.py reproduces both). oab/capture-2 also has hold0.ana, the bench's tick notes on its first hold. Run 3's hold3 seated in a low-resistance state (about -21%, a brush bridging two commutator segments is the leading reading) and its reading went to 83 C; the false excess carries into gaps 4 and 5, so only gap 1 of run 3 grades the carry. Run 4's hold0 seated in the same state and its guards dropped it twice. The th columns are the telemetry span as `th` names them: current and bias are the shunt sample and the tracked zero in counts, duty_applied_q15 is signed (negative toward the low stop), i_mean / vdiff_mean / duty_mean_q15 are the identification aggregates (not used), load_q15 / tick_over / tick_lost / stack_free exist only in run 4 and later.

thermal/capture-N is one `osc ident thermal` run (480 s seated at the low stop at the limit, then centred, torque off): thermal.csv.gz (the rows the fit read: t_s, the kernel's excess x_cc over the NTC, the power p in vcount x ccount, therm_flags; capture-2 also i, v, duty), anchor_snapshots.csv.gz (every poll of the run; capture-2 also has t_ntc_cc and therm_flags), anchor.csv.gz (every aggregate window: t_ms, i, vdiff, duty_q15), report.out (the console), rest.csv.gz (the 600 s torque-off rest before it, for the rest offset), meter.csv.gz. capture-1 is bringup ident-thermal V2 (run dir 1791432546, osc 52934a41, the free two-parameter fit: tau 45.7 s, R_th 24.3 C/W; rest = v1b-rest.csv). capture-2 is the first re-validation hold rv1 (run dir 1791437926, osc dbd22338, a g fit with tau tied to it; rest = rest-rv0.csv; gates.out is the bench's rv_gates.py output: G1, G2, G3 FAIL, G4 PASS, a 1.35% R step in one second at 248 s). The two re-validation holds planned after rv1 had not run when the data was copied. Neither osc build is on main at b4c4775b. The thermal snapshots end at the hold's last poll; the centring and torque-off after it are not logged, and the console returned 1.6 s after the last poll. The can's fall after both holds starts 13 to 17 s after the last poll on the host clock: whether that is the meter's packets running late or a real lag of the can is open (notebook 19 sec 6).

boot/capture-1 is bringup E1: the shipped image flashed and reset 129 s after thermal/capture-1's hold ended (the winding still warm), boot.csv.gz logs from 5 ms after the reset at 0.5 s for 660 s with torque off. boot/capture-2 is bringup rest-rv0: power-on after 53 min off, logged from 20.7 s after the reset at 2 s for 600 s; it is the same file as thermal/capture-2/rest.csv.gz. sample_tick counts 20 kHz ticks from the reset.

firstseat/capture-N are the two 60 s holds at the low stop that fired the retired hot-boot rule (bringup ident-thermal P0): capture-1 on 26f38948 after a power-on and a GUI session that moved the stop (it reads 218-220 here against 262-265 in the reps; the MG90's output gear is friction-bushed on the pot shaft), capture-2 on bb9b0ceb right after its flash. Both based about 9% over the stored r0_q12 3932 and stepped t_winding about 20 C. hold.csv.gz is the th log (phases pre, seek, hold, tail, centre), hold.out the console, status.out (capture-2) the status read before it.

anchor-m1.out is the anchor console that wrote the shipped board's thermometer set (th_alpha_q24 2097, th_g_q016 1500, th_mu_q016 8073, the NTC curve 2048/2500/563/5779, rtherm_i_min_counts 232, r0_q12 3932); r0-write.out is the hand write of r0_q12 4078 (run 4's normal-state anchor) after a re-anchor landed in the low state. Together they are the CALIB the ident-thermal captures ran on.

Rest offsets (can minus NTC over each rest's last 180 s): -2.75 (oab/capture-1), -2.03 (oab/capture-2), -2.65 (thermal/capture-1), -2.63 (thermal/capture-2) C. The NTC rests over the can; nothing here says which of the two is off.

Cuts and conversions: every csv is gzipped; nothing else differs from what the scripts wrote, except the meter files of thermal/capture-1 and -2, boot/capture-1 and -2 and firstseat/capture-1 and -2, which are slices of the session's one meter log around each capture (thermal/capture-2's ends 300 s after the hold, the log was still running). Thermocouple packets outside 10 to 80 C are link glitches; none occur in these files. The bringup run-2 meter log (a faulty probe) is not here.

Source: osc-dev-v006-bringup captures/servo-pass/thermo-ntc/pr311 (runs 3 and 4, anchor-m1, NOTE.txt and bench-log.md there) and captures/servo-pass/thermo-ntc/ident-thermal (V2, E1, P0, rv0, rv1, bench-log.md there); the analysis is bringup kb/rca-311-g2.md, kb/rca-311-hold3.md and kb/rca-ident-thermal.md. No capture carries a sense block, so the board is not read from the data: these are rev 2A board #1 captures by the bench log, and nothing here identifies the unit."""
