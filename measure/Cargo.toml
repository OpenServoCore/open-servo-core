[workspace]
resolver = "2"

[package]
name        = "osc-measure"
version     = "0.1.0"
edition     = "2024"
description = "Sans-io servo identification: measured inputs, the nameplate, the board and a policy to the servo's constant set, by rules. Compiles to wasm for the GUI."
license     = "MIT OR Apache-2.0"

[dependencies]
serde          = { version = "1", features = ["derive"] }
osc-servo-core = { path = "../firmware/lib/core" }

[dev-dependencies]
serde_json = "1"
