[workspace]
resolver = "2"

[package]
name        = "osc"
version     = "0.1.0"
edition     = "2024"
description = "The bus driver CLI for an osc-native bus through the osc-adapter: discover, provision, update, manage. osc-ident is the identification, calibration and tuning tool."
license     = "MIT OR Apache-2.0"

[dependencies]
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
dialoguer    = "0.11"
osc-client   = { path = "../../client" }
osc-protocol = { path = "../../firmware/lib/osc-protocol" }
osc-servo-core = { path = "../../firmware/lib/core" }
serde_json   = "1"

[dev-dependencies]
osc-client = { path = "../../client", features = ["fake-adapter"] }
