[package]
name        = "osc-client-web"
version     = "0.1.0"
edition     = "2024"
description = "Browser bindings for osc-client: the osc-adapter over WebUSB from a page, typed through generated TypeScript declarations."
license     = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osc-client           = { path = "..", default-features = false, features = ["webusb"] }
osc-protocol         = { path = "../../firmware/lib/osc-protocol" }
serde                = { version = "1", features = ["derive"] }
serde_bytes          = "0.11"
serde-wasm-bindgen   = "0.6"
tsify                = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen         = "0.2"

# Async exports expand to a future_to_promise call; the crate is a no-op
# elsewhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
