[workspace]
resolver = "2"

[package]
name        = "osc-ident"
version     = "0.1.0"
edition     = "2024"
description = "Sans-io servo identification: experiments emit wire commands and consume telemetry; fits and gain synthesis are pure functions. Compiles to wasm for the GUI."
license     = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
flate2     = "1"
serde_json = "1"

# The mg90-a parity build tracks 100 rungs of 20 kHz current: minutes
# unoptimized, seconds optimized. Overflow checks and debug assertions stay.
[profile.test]
opt-level = 2
